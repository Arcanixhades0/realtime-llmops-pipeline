global:
  scrape_interval: 5s       # how often Prometheus pulls /metrics
  evaluation_interval: 5s   # how often alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:8001"]
